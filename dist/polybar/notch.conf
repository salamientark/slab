; >>> i3-notch >>>
; Managed by i3-notch installer. Do not edit between markers.
; To remove: run uninstall.sh or strip this block.

[bar/notch]
width = 22%
height = 28pt
offset-x = 39%
radius = 14
bottom = false
override-redirect = true
wm-restack = i3

background = #ff1e1e2e
foreground = #ffffff
border-size = 2pt
border-color = #ff7aa2f7

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = monospace;2
font-1 = MesloLGS NF:size=11;2

modules-center = i3notch

enable-ipc = true

[module/i3notch]
type = custom/script
exec = bash -c 'while ! __I3NOTCH_BIN__/notchctl subscribe --format polybar; do sleep 2; done'
tail = true
format = <label>
label = %output%
format-padding = 1
click-left = __I3NOTCH_BIN__/notchctl jump

; <<< i3-notch <<<
